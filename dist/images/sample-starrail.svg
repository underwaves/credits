<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hsr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a16" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#180d38" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-hsr)"/>
  
  <!-- Astral Express Orbit Lines -->
  <ellipse cx="400" cy="220" rx="140" ry="60" fill="none" stroke="url(#cyan-glow)" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" transform="rotate(-15 400 220)"/>
  <ellipse cx="400" cy="220" rx="120" ry="50" fill="none" stroke="url(#purple-glow)" stroke-width="2" opacity="0.3" transform="rotate(25 400 220)"/>

  <!-- Core Glowing Emblem -->
  <circle cx="400" cy="220" r="95" fill="#581c87" opacity="0.5" filter="blur(25px)"/>
  <circle cx="400" cy="220" r="80" fill="#1e1035" stroke="url(#purple-glow)" stroke-width="3"/>

  <!-- Star Rail Icon Motif (Train / Star) -->
  <path d="M400 165 L412 205 L450 220 L412 235 L400 275 L388 235 L350 220 L388 205 Z" fill="url(#cyan-glow)"/>
  <circle cx="400" cy="220" r="14" fill="#ffffff" opacity="0.9"/>

  <!-- Badge Status -->
  <rect x="290" y="325" width="220" height="38" rx="19" fill="#047857" opacity="0.95"/>
  <text x="400" y="350" font-family="'Kanit', 'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    ✓ ส่งมอบไอดีสำเร็จ 100%
  </text>

  <!-- Title & Info -->
  <text x="400" y="405" font-family="'Kanit', 'Prompt', sans-serif" font-size="28" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    HONKAI: STAR RAIL
  </text>
  <text x="400" y="440" font-family="'Prompt', sans-serif" font-size="18" fill="#c084fc" text-anchor="middle">
    สลิปชำระเงิน &amp; รีวิวยืนยันจากลูกค้า
  </text>

  <!-- Verification Card -->
  <rect x="180" y="470" width="440" height="75" rx="14" fill="#180e29" stroke="#6b21a8" stroke-width="1.5"/>
  <circle cx="215" cy="507" r="18" fill="#a855f7"/>
  <text x="215" y="513" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">⚡</text>
  <text x="250" y="498" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#f3e8ff">ไอดีสะอาด ปลอดภัย ไม่ผ่านโปรแกรมโกง</text>
  <text x="250" y="522" font-family="'Prompt', sans-serif" font-size="13" fill="#a855f7">Verified Transaction ID: #HSR-994201</text>
</svg>
