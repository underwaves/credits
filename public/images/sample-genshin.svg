<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Glowing Game Icon Container -->
  <circle cx="400" cy="220" r="110" fill="#312e81" opacity="0.4" filter="blur(20px)"/>
  <circle cx="400" cy="220" r="85" fill="#1e1b4b" stroke="url(#gold)" stroke-width="3"/>
  
  <!-- Stars Icon / Emblem -->
  <path d="M400 160 L415 200 L455 205 L425 230 L435 270 L400 248 L365 270 L375 230 L345 205 L385 200 Z" fill="url(#gold)"/>

  <!-- Badge Status -->
  <rect x="290" y="325" width="220" height="38" rx="19" fill="#15803d" opacity="0.9"/>
  <text x="400" y="350" font-family="'Kanit', 'Prompt', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    ✓ ส่งมอบไอดีสำเร็จ 100%
  </text>

  <!-- Title & Info -->
  <text x="400" y="405" font-family="'Kanit', 'Prompt', sans-serif" font-size="28" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    GENSHIN IMPACT
  </text>
  <text x="400" y="440" font-family="'Prompt', sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">
    หลักฐานการเปลี่ยนมือ &amp; สลิปการโอน
  </text>

  <!-- Mock Chat bubble / Transaction Box -->
  <rect x="180" y="470" width="440" height="75" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="215" cy="507" r="18" fill="#3b82f6"/>
  <text x="215" y="513" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">🛡️</text>
  <text x="250" y="498" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">ประกันความปลอดภัย ไม่ดึงคืน</text>
  <text x="250" y="522" font-family="'Prompt', sans-serif" font-size="13" fill="#64748b">Verified Transaction ID: #GEN-883921</text>
</svg>
